<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">RYOPO: a shared RGB-D predictor for a set of object poses</title>
  <desc id="description">An RGB image and depth map enter shared image and scene encoders. Object queries integrate object-level depth during set prediction, then condition pose refinement to produce class, rotation, translation and size for multiple objects. Output cubes are schematic.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17251d"/></marker>
    <g id="cube" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M0 13 29 20 45 7 16 0Z M0 13v28l29 7 16-13V7 M29 20v28 M16 0v28L0 41 M16 28l29 7"/><path d="M12 31h17m-17 0V14m0 17 10-9" stroke-width="2"/></g>
    <clipPath id="rgb-clip"><rect x="18" y="36" width="164" height="123" rx="6"/></clipPath>
    <clipPath id="depth-clip"><rect x="18" y="170" width="164" height="123" rx="6"/></clipPath>
  </defs>
  <rect width="1200" height="340" rx="10" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111814" text-anchor="middle">
    <image href="{{RGB_DATA}}" x="18" y="36" width="164" height="123" clip-path="url(#rgb-clip)"/>
    <image href="{{DEPTH_DATA}}" x="18" y="170" width="164" height="123" clip-path="url(#depth-clip)"/>
    <g font-size="13" font-weight="700"><rect x="26" y="43" width="44" height="23" rx="3" fill="white"/><text x="48" y="59">RGB</text><rect x="26" y="178" width="54" height="23" rx="3" fill="white"/><text x="53" y="194">Depth</text></g>
    <text x="100" y="321" font-size="18" font-weight="700">Full-frame input</text>

    <rect x="223" y="69" width="687" height="219" rx="14" fill="#f7faf6" stroke="#c7d8cb" stroke-width="1.5"/>
    <text x="245" y="98" text-anchor="start" font-size="21" font-weight="700" fill="#176541">RYOPO</text>
    <text x="892" y="98" text-anchor="end" font-size="14">One forward pass for all objects</text>
    <g stroke="#17251d" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
      <path d="M203 186H239"/><path d="M399 186H442"/><path d="M637 186H680"/><path d="M885 186H940"/>
    </g>
    <path d="M182 97H203V231H182" stroke="#17251d" stroke-width="2.4" fill="none"/>
    <rect x="241" y="128" width="158" height="116" rx="7" fill="#dbeaf6" stroke="#46769b" stroke-width="1.5"/>
    <text x="320" y="159" font-size="20" font-weight="700"><tspan x="320">Shared</tspan><tspan x="320" dy="24">encoders</tspan></text>
    <text x="320" y="216" font-size="14">RGB + 3D scene</text>

    <rect x="444" y="128" width="193" height="116" rx="7" fill="#f8edbf" stroke="#a38427" stroke-width="1.5"/>
    <text x="540.5" y="159" font-size="20" font-weight="700"><tspan x="540.5">Geometry-aware</tspan><tspan x="540.5" dy="24">set prediction</tspan></text>
    <text x="540.5" y="216" font-size="14">Object queries + depth</text>

    <rect x="682" y="128" width="203" height="116" rx="7" fill="#f9dfc7" stroke="#ae703b" stroke-width="1.5"/>
    <text x="783.5" y="159" font-size="20" font-weight="700"><tspan x="783.5">Pose-conditioned</tspan><tspan x="783.5" dy="24">refinement</tspan></text>
    <text x="783.5" y="216" font-size="14">Query + current pose</text>
    <path d="M827 245v24h-88v-21" stroke="#17251d" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

    <g fill="#fff" stroke="#d7e0d9" stroke-width="1.2"><rect x="943" y="50" width="235" height="69" rx="7"/><rect x="943" y="133" width="235" height="69" rx="7"/><rect x="943" y="216" width="235" height="69" rx="7"/></g>
    <use href="#cube" transform="translate(959 59)" color="#176541"/>
    <use href="#cube" transform="translate(959 142)" color="#3176a1"/>
    <use href="#cube" transform="translate(959 225)" color="#b77529"/>
    <g text-anchor="start" font-size="17" font-weight="700"><text x="1021" y="80">Object 1</text><text x="1021" y="163">Object 2</text><text x="1021" y="246">Object 3</text></g>
    <g text-anchor="start" font-size="14"><text x="1021" y="102">class + 9-DoF pose</text><text x="1021" y="185">class + 9-DoF pose</text><text x="1021" y="268">class + 9-DoF pose</text></g>
    <text x="1060" y="321" font-size="18" font-weight="700">Set of object poses</text>
    <text x="560" y="321" font-size="15">9-DoF pose = rotation + translation + metric size</text>
  </g>
</svg>
